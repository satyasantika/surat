# Produksi Persuratan & Layanan FKIP (pola docker-apps, Profil Ringan: STANDAR-TEKNIS §1b dan §7).
#   cp .env.production.example .env   → isi rahasia (jangan commit .env)
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
# MariaDB berjalan NATIVE di host (DB_HOST=host.docker.internal). Compose ini TIDAK memuat container database,
# Redis, Horizon, maupun Gotenberg; antrean, cache, dan sesi memakai database, worker dinyalakan penjadwal.
name: surat

# Log Docker dirotasi (STANDAR-TEKNIS §7.1).
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: surat-app:${SURAT_VERSI:-latest}
  env_file: .env
  restart: unless-stopped
  extra_hosts: ["host.docker.internal:host-gateway"]
  networks: [internal]
  logging: *log
  volumes:
    - storage:/var/www/html/storage
  environment:
    PHP_MEMORY_LIMIT: 512M
    GOTENBERG_URL: http://gotenberg:3000

services:
  php:
    <<: *app
    mem_limit: 512m
    build:
      context: .
      target: app
      args:
        ASSET_URL: ${ASSET_URL:-https://supportfkip.unsil.ac.id/surat}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(file_exists(\"/var/www/html/vendor/autoload.php\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: surat-web:${SURAT_VERSI:-latest}
    build:
      context: .
      target: web
      args:
        ASSET_URL: ${ASSET_URL:-https://supportfkip.unsil.ac.id/surat}
    restart: unless-stopped
    mem_limit: 64m
    logging: *log
    depends_on: [php]
    # Hanya loopback: reverse proxy fakultas yang membuka ke publik (TLS di sana).
    ports: ["127.0.0.1:${HTTP_PORT:-8028}:80"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Penjadwal sekaligus pemicu worker antrean (routes/console.php: queue:work tiap menit, --stop-when-empty).
  # Worker berjalan sebagai subproses di container ini: batas memori mencakup worker default (--memory=256)
  # dan worker berat (--memory=512). Nilai awal; wajib dibuktikan dengan `docker stats` (STANDAR-TEKNIS §7.1).
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    mem_limit: 768m
    stop_grace_period: 60s

  # Cadangan terjadwal: dipanggil host (cron/systemd) — lihat docs/DEPLOY.md §6.
  # Hanya KLIEN dump (mariadb-dump) ke basis data host, bukan server basis data.
  backup:
    image: mariadb:10.11
    profiles: ["backup"]
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 128m
    logging: *log
    volumes:
      - ./docker/backup:/skrip:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh"]
    command: ["/skrip/backup.sh"]
    networks: [internal]

  # PDF (surat tertandatangan QR, dsb.) — hanya dipakai Surat, jadi dibungkus di sini (bukan layanan bersama).
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    mem_limit: 512m
    logging: *log
    command: ["gotenberg", "--api-timeout=30s", "--chromium-disable-javascript=true", "--chromium-allow-list=^file:///tmp/.*"]
    networks: [internal]

networks:
  internal: {}

volumes:
  storage:
    external: true
    name: docker-apps_surat-storage
